plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
}

javafx {
    version = '22'

    modules = [
        'javafx.controls',
        'javafx.graphics'
    ]
}

application {
    mainClass.set('IsometricTemplateFX')
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}
